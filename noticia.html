<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noticias — Horizonte Temporal</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="wordmark" href="index.html#inicio">HORIZONTE <b>TEMPORAL</b></a><nav><a href="index.html#novedades">← VOLVER A NOTICIAS</a></nav></header><main class="news-article" id="article"><p>Cargando noticia…</p></main><script>const root=document.querySelector('#article');fetch('contenido.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const id=new URLSearchParams(location.search).get('id');const n=(d.noticias||[]).find(x=>(x.id||x.fecha)===id&&x.publicar!==false);root.replaceChildren();if(!n){root.textContent='Noticia no encontrada.';return;}document.title=(n.titulo||'Noticia')+' — Horizonte Temporal';const add=(tag,txt)=>{const e=document.createElement(tag);e.textContent=txt||'';root.append(e);return e};add('p',n.fecha);add('h1',n.titulo);if(n.imagen){const im=document.createElement('img');im.src='images/'+(n.imagen.startsWith('images/')?n.imagen.slice(7):n.imagen);im.alt=n.titulo||'';root.append(im)}add('p',n.contenido||n.texto);if(n.relacionado){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Información relacionada';const p=document.createElement('p');p.textContent=n.relacionado;details.append(summary,p);root.append(details)}if(n.enlace&&(n.enlace.startsWith('https://')||n.enlace.startsWith('http://'))){const a=document.createElement('a');a.href=n.enlace;a.textContent=n.texto_enlace||'Enlace relacionado';a.target='_blank';a.rel='noopener noreferrer';root.append(a)}}).catch(()=>root.textContent='No se pudo cargar la noticia.');</script></body></html>
