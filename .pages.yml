media:
  input: images
  output: /images
content:
  - name: sitio
    label: Contenidos de Horizonte Temporal
    type: file
    path: contenido.json
    format: json
    fields:
      - name: logo_portada
        label: Logo de portada (PNG transparente; archivo de images o URL)
        type: string
      - name: video_portada
        label: URL o ruta del video MP4 de portada
        type: string
      - name: video_poster
        label: Imagen de respaldo del video
        type: string
      - name: galeria_ayuda
        label: Texto de ayuda de la galería
        type: text
      - name: contacto_texto
        label: Contacto - presentación
        type: text
      - name: contacto_email
        label: Correo de contacto
        type: string
      - name: redes_sociales
        label: Redes sociales
        type: object
        list: true
        fields:
          - name: nombre
            label: Red social
            type: string
          - name: url
            label: URL
            type: string
      - name: presentacion
        label: Frase de portada
        type: text
      - name: historia_1
        label: Historia - párrafo 1
        type: text
      - name: proceso_1
        label: Detrás de las imágenes - texto principal
        type: text
      - name: video_proceso
        label: Detrás de las imágenes - video (URL de YouTube, Vimeo o MP4/WebM)
        type: string
      - name: video_poster_proceso
        label: Detrás de las imágenes - imagen de portada del video (para MP4/WebM)
        type: image
      - name: capitulos
        label: Siete capítulos
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
          - name: imagen
            label: Nombre de imagen (archivo en images)
            type: string
          - name: texto
            label: Sinopsis
            type: text
          - name: epigrafe
            label: Secuencia cinematográfica - texto de la escena inicial
            type: text
          - name: escenas
            label: Secuencia cinematográfica - escenas adicionales (máximo 7)
            type: object
            list: true
            fields:
              - name: imagen
                label: Imagen de la escena (elige una existente o sube una nueva)
                type: image
              - name: texto
                label: Texto breve que aparece en la escena
                type: text
      - name: galeria
        label: Galería
        type: object
        list: true
        fields:
          - name: imagen
            label: Nombre de imagen
            type: string
          - name: titulo
            label: Descripción
            type: string
          - name: categoria
            label: Categoría (cosmos, tierra, criaturas)
            type: string
      - name: noticias
        label: Noticias y novedades
        type: object
        list: true
        fields:
          - name: id
            label: Identificador único (sin espacios)
            type: string
          - name: fecha
            label: Fecha (AAAA-MM-DD)
            type: string
          - name: titulo
            label: Título
            type: string
          - name: texto
            label: Texto de la noticia
            type: text
          - name: imagen
            label: Nombre de imagen
            type: string
          - name: contenido
            label: Noticia completa
            type: text
          - name: relacionado
            label: Información relacionada desplegable
            type: text
          - name: enlace
            label: URL opcional
            type: string
          - name: texto_enlace
            label: Texto del enlace
            type: string
          - name: publicar
            label: Publicar noticia
            type: boolean
      - name: compra
        label: Dónde comprar
        type: object
        fields:
          - name: titulo
            label: Título
            type: string
          - name: descripcion
            label: Descripción
            type: text
          - name: precio
            label: Precio
            type: string
          - name: estado
            label: Estado (próximamente, disponible...)
            type: string
          - name: imagen
            label: Nombre de imagen
            type: string
          - name: enlaces
            label: Tiendas y puntos de venta
            type: object
            list: true
            fields:
              - name: nombre
                label: Nombre de la tienda
                type: string
              - name: url
                label: Enlace de compra
                type: string
