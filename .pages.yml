media:
  input: images
  output: /images
content:
  - name: sitio
    label: "EDITAR HORIZONTE TEMPORAL — secciones en orden de la web"
    type: file
    path: contenido.json
    format: json
    fields:
      - name: encabezado
        label: "ENCABEZADO Y NAVEGACIÓN"
        type: object
        description: "Barra superior, enlaces del menú y descripción del sitio."
        fields:
          - name: descripcion_seo
            label: "Descripción de la web para buscadores"
            type: text
          - name: marca_cabecera
            label: "Nombre en la barra superior"
            type: string
          - name: menu
            label: "Botón del menú"
            type: string
          - name: nav_historia
            label: "Menú: Historia"
            type: string
          - name: nav_galeria
            label: "Menú: Galería"
            type: string
          - name: nav_proceso
            label: "Menú: Proceso"
            type: string
          - name: nav_novedades
            label: "Menú: Novedades"
            type: string
          - name: nav_comprar
            label: "Menú: Dónde comprar"
            type: string
          - name: nav_contacto
            label: "Menú: Contacto"
            type: string
      - name: portada
        label: "PORTADA / INICIO"
        type: object
        description: "Video silencioso y automático, imagen de fondo, logotipo y texto de presentación."
        fields:
          - name: logo_portada
            label: "Logo de la portada"
            type: image
          - name: imagen_portada
            label: "Imagen de fondo (si no hay video)"
            type: image
          - name: video_portada
            label: "Video de inicio (YouTube o MP4/WebM)"
            type: string
          - name: video_poster
            label: "Imagen de respaldo del video"
            type: image
          - name: hero_titulo
            label: "Título alternativo (sin logo)"
            type: string
          - name: presentacion
            label: "Texto de presentación"
            type: text
          - name: hero_pie_izq
            label: "Pie izquierdo"
            type: string
          - name: hero_pie_der
            label: "Pie derecho"
            type: string
      - name: historia
        label: "01 / LA HISTORIA"
        type: object
        description: "Texto, título e imagen grande de la historia."
        fields:
          - name: historia_indice
            label: "Número y rótulo (01 / LA HISTORIA)"
            type: string
          - name: historia_genero
            label: "Subtítulo o género"
            type: string
          - name: historia_entrada
            label: "Frase inicial pequeña"
            type: string
          - name: historia_titulo
            label: "Título grande"
            type: string
          - name: historia_1
            label: "Relato principal"
            type: text
          - name: imagen_historia
            label: "Imagen grande de Historia"
            type: image
          - name: historia_pie
            label: "Pie de la imagen"
            type: string
      - name: cita_destacada
        label: "CITA DESTACADA / IMAGEN Y TEXTO"
        type: object
        description: "Franja situada entre La historia y Archivo visual. Despliega este bloque para cambiar la imagen de la cita."
        fields:
          - name: imagen
            label: "CAMBIAR IMAGEN DE FONDO DE LA CITA"
            type: image
            description: "Selecciona otra imagen o sube una nueva. Vacío = ocultar imagen."
          - name: rotulo
            label: "Rótulo superior de la cita"
            type: string
          - name: texto
            label: "Texto principal de la cita"
            type: text
          - name: credito
            label: "Texto inferior de la cita"
            type: string
      - name: galeria_seccion
        label: "04 / ARCHIVO VISUAL — ENCABEZADO"
        type: object
        description: "Título, subtítulo e instrucciones de la galería."
        fields:
          - name: galeria_indice
            label: "Número y rótulo (04 / ARCHIVO VISUAL)"
            type: string
          - name: galeria_subtitulo
            label: "Subtítulo de la sección"
            type: string
          - name: galeria_titulo
            label: "Título grande"
            type: string
          - name: galeria_ayuda
            label: "Texto de ayuda"
            type: text
          - name: capitulo_etiqueta
            label: "Palabra CAPÍTULO en la galería"
            type: string
      - name: capitulos
        label: "ARCHIVO VISUAL — SIETE CAPÍTULOS Y TRES IMÁGENES CADA UNO"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titulo}"
        fields:
          - name: titulo
            label: "Título del capítulo"
            type: string
          - name: galeria
            label: "Imágenes del capítulo (máximo tres)"
            type: object
            list:
              max: 3
              collapsible:
                collapsed: true
                summary: "{pie}"
            fields:
              - name: imagen
                label: "Elegir, cambiar o quitar la imagen"
                type: image
              - name: pie
                label: "Pie de imagen (opcional)"
                type: string
      - name: proceso
        label: "05 / DETRÁS DE LAS IMÁGENES"
        type: object
        description: "Texto y video silencioso de reproducción automática."
        fields:
          - name: proceso_indice
            label: "Número y rótulo"
            type: string
          - name: proceso_subtitulo
            label: "Subtítulo"
            type: string
          - name: proceso_entrada
            label: "Frase pequeña"
            type: string
          - name: proceso_titulo
            label: "Título grande"
            type: string
          - name: proceso_1
            label: "Texto sobre el proceso creativo"
            type: text
          - name: video_proceso
            label: "URL del video (YouTube, Vimeo o MP4/WebM)"
            type: string
          - name: video_poster_proceso
            label: "Imagen de respaldo del video"
            type: image
          - name: proceso_video_pie
            label: "Pie del video"
            type: string
      - name: novedades_seccion
        label: "06 / BITÁCORA — ENCABEZADO"
        type: object
        description: "Títulos, rótulos y etiquetas de las noticias."
        fields:
          - name: noticias_indice
            label: "Número y rótulo"
            type: string
          - name: noticias_subtitulo
            label: "Subtítulo"
            type: string
          - name: noticias_titulo
            label: "Título grande"
            type: string
          - name: noticias_intro
            label: "Introducción a noticias"
            type: text
          - name: noticia_leer
            label: "Texto del enlace para leer noticia"
            type: string
          - name: noticias_vacio
            label: "Mensaje cuando no hay noticias"
            type: text
          - name: noticias_volver
            label: "Página de noticia: volver"
            type: string
          - name: noticia_info_relacionada
            label: "Página de noticia: texto información relacionada"
            type: string
          - name: noticia_no_encontrada
            label: "Página de noticia: texto no encontrada"
            type: string
      - name: noticias
        label: "BITÁCORA — NOTICIAS PUBLICADAS O EN BORRADOR"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titulo}"
        fields:
          - name: id
            label: "Identificador único"
            type: string
          - name: fecha
            label: "Fecha (AAAA-MM-DD)"
            type: string
          - name: titulo
            label: "Nombre de la publicación"
            type: string
          - name: texto
            label: "Texto de la cita"
            type: text
          - name: imagen
            label: "Imagen de la edición"
            type: image
          - name: contenido
            label: "Noticia completa"
            type: text
          - name: relacionado
            label: "Información relacionada opcional"
            type: text
          - name: enlace
            label: "URL externa opcional"
            type: string
          - name: texto_enlace
            label: "Texto del enlace externo"
            type: string
          - name: publicar
            label: "Mostrar esta noticia"
            type: boolean
      - name: compra
        label: "07 / EDICIÓN IMPRESA Y DÓNDE COMPRAR"
        type: object
        fields:
          - name: compra_indice
            label: "Número y rótulo"
            type: string
          - name: compra_subtitulo
            label: "Subtítulo"
            type: string
          - name: compra_entrada
            label: "Frase pequeña"
            type: string
          - name: titulo
            label: "Nombre de la publicación"
            type: string
          - name: descripcion
            label: "Descripción de la edición"
            type: text
          - name: precio
            label: "Precio (opcional)"
            type: string
          - name: estado
            label: "Estado de la publicación"
            type: string
          - name: imagen
            label: "Imagen de la edición"
            type: image
          - name: enlaces
            label: "Tiendas y puntos de venta"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{nombre}"
            fields:
              - name: nombre
                label: "Nombre del punto de venta"
                type: string
              - name: url
                label: "Enlace a tienda"
                type: string
      - name: contacto
        label: "08 / CONTACTO Y REDES SOCIALES"
        type: object
        fields:
          - name: contacto_indice
            label: "Número y rótulo"
            type: string
          - name: contacto_subtitulo
            label: "Subtítulo"
            type: string
          - name: contacto_titulo
            label: "Título grande"
            type: string
          - name: contacto_texto
            label: "Presentación de contacto"
            type: text
          - name: contacto_email
            label: "Correo electrónico"
            type: string
          - name: contacto_boton
            label: "Texto del botón para escribir"
            type: string
          - name: redes_sociales
            label: "Enlaces a redes sociales"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{nombre}"
            fields:
              - name: nombre
                label: "Red social"
                type: string
              - name: url
                label: "Enlace de la red social"
                type: string
      - name: cierre
        label: "CIERRE DE LA PÁGINA"
        type: object
        fields:
          - name: imagen_cierre
            label: "Imagen de fondo del cierre"
            type: image
          - name: logo_cierre
            label: "Logo del cierre (opcional)"
            type: image
          - name: cierre_rotulo
            label: "Frase pequeña"
            type: string
          - name: cierre_titulo
            label: "Título alternativo si no hay logo"
            type: string
          - name: cierre_pie
            label: "Texto final"
            type: string
          - name: cierre_boton
            label: "Botón para volver al inicio"
            type: string
      - name: pie
        label: "PIE DE PÁGINA — LOGO DE LA EDITORIAL Y TEXTOS"
        type: object
        description: "El logo editorial se muestra en el pie de página dentro de un espacio cuadrado, sin recortarlo. Déjalo vacío para ocultarlo."
        fields:
          - name: logo_editorial
            label: "LOGO CUADRADO DE LA EDITORIAL — elegir, subir o quitar"
            type: image
          - name: nombre_editorial
            label: "Nombre de la editorial (descripción accesible del logo)"
            type: string
          - name: footer_marca
            label: "Nombre en pie de página"
            type: string
          - name: footer_descripcion
            label: "Descripción breve"
            type: string
          - name: footer_credito
            label: "Crédito del pie"
            type: string
